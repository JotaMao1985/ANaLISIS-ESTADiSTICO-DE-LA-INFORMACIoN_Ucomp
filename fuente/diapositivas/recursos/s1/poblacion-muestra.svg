<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="pm-titulo pm-desc">
  <title id="pm-titulo">Población, muestra, parámetro y estadístico</title>
  <desc id="pm-desc">A la izquierda, la población: los 12 000 pedidos del semestre, cuya media de tiempo de
    entrega es el parámetro mu, 35,1 minutos. Una flecha de muestreo aleatorio lleva a la derecha, a una
    muestra de 100 pedidos, cuya media es el estadístico x barra, 34,4 minutos. Una flecha punteada
    de regreso indica la inferencia: usar el estadístico para estimar el parámetro.</desc>
